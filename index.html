<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
<h1>CampusConnect registration</h1>
<p>Practice form: use fictional data only. Nothing is sent anywhere.</p>
<noscript><p class="field-error">Error: this form needs JavaScript to validate and move between steps.</p></noscript>
<div id="error-summary" tabindex="-1" hidden></div>

<p class="progress" role="status">Step <span id="stepNum">1</span> of 4</p>

<form id="regForm" novalidate>
  <!-- STEP 1: IDENTITY -->
  <section class="step active" data-step="1">
    <h2 tabindex="-1">Identity</h2>
    <label for="fullname">Full name (required)</label>
    <input id="fullname" name="fullname" type="text" autocomplete="off"
           required pattern="[A-Za-z '\-]+">
    <div class="field-error" id="fullname_err"></div>

    <label for="campusEmail">Campus email (@student.gsu.edu, required)</label>
    <input id="campusEmail" name="campusEmail" type="email" autocomplete="off" required>
    <div class="field-error" id="campusEmail_err"></div>

    <label for="studentId">Fictional student ID (9 digits, first digit 1-9, required)</label>
    <input id="studentId" name="studentId" type="text" inputmode="numeric" autocomplete="off"
           required pattern="[1-9]\d{8}">
    <div class="field-error" id="studentId_err"></div>
    <div class="buttons"><button type="button" data-next>Next →</button></div>
  </section>

  <!-- STEP 2: SECURITY (password + live checklist + confirm) -->
  <section class="step" data-step="2">
    <h2 tabindex="-1">Security</h2>
    <label for="password">Practice password (required)</label>
    <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" aria-describedby="pwRules password_err">
    <ul id="pwRules">
      <li data-rule="len">At least 8 characters</li>
      <li data-rule="upper">One uppercase letter</li>
      <li data-rule="lower">One lowercase letter</li>
      <li data-rule="digit">One digit</li>
      <li data-rule="symbol">One symbol (!@#$…)</li>
    </ul>
    <div class="field-error" id="password_err"></div>
    <label for="confirm">Confirm practice password (required)</label>
    <input id="confirm" name="confirm" type="password" required autocomplete="new-password">
    <div class="field-error" id="confirm_err"></div>
    <div class="buttons">
      <button type="button" data-back>← Back</button>
      <button type="button" data-next>Next →</button>
    </div>
  </section>

  <!-- STEP 3: PROFILE (tier radio, interests multi-select, bio) -->
  <section class="step" data-step="3">
    <h2 tabindex="-1">Profile</h2>
    <fieldset role="radiogroup" aria-required="true" aria-describedby="tier_err">
      <legend>Tier (required)</legend>
      <label><input id="tier_basic" type="radio" name="tier" value="basic" required> Basic ($25)</label>
      <label><input type="radio" name="tier" value="standard" checked> Standard ($50)</label>
      <label><input type="radio" name="tier" value="deluxe"> Deluxe ($100)</label>
      <div class="field-error" id="tier_err"></div>
    </fieldset>

    <label for="interests">Interests (choose 1–3, required; Ctrl/Cmd-click or Shift+arrows to select several)</label>
    <select id="interests" name="interests[]" multiple size="4" required>
      <option>Robotics</option><option>Debate</option>
      <option>Photography</option><option>Gaming</option>
    </select>
    <div class="field-error" id="interests_err"></div>

    <label for="bio">Bio (optional, 140 characters max)</label>
    <textarea id="bio" name="bio" maxlength="140" aria-describedby="bioHelp bio_err"></textarea>
    <p id="bioHelp" class="hint"><span id="bioCount">140</span> characters left</p>
    <div class="field-error" id="bio_err"></div>

    <label class="check"><input id="terms" type="checkbox" name="terms" required> I accept the terms (required)</label>
    <div class="field-error" id="terms_err"></div>
    <div class="buttons">
      <button type="button" data-back>← Back</button>
      <button type="button" data-next>Review →</button>
    </div>
  </section>

  <!-- STEP 4: REVIEW (summary + Edit buttons + final submit) -->
  <section class="step" data-step="4">
    <h2 tabindex="-1">Review</h2>
    <div id="reviewSummary"></div>
    <div class="buttons">
      <button type="button" data-back>← Back</button>
      <button type="submit">Submit registration</button>
    </div>
  </section>
</form>
<p id="projectStatus" role="status"></p>
</main>

<script src="validator.js"></script>
</body>
</html>
